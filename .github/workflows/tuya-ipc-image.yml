name: Build Tuya IPC terminal image

on:
  push:
    branches: [main]
    paths:
      - "images/tuya-ipc-terminal/**"
      - ".github/workflows/tuya-ipc-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: images/tuya-ipc-terminal
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sashasimkin/tuya-ipc-terminal:tuya-d65b3e9
