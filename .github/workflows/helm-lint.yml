name: Lint Helm Charts
on: [pull_request]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v3
        with:
          version: v3.22.1
      - name: Verify Helm Templates
        run: |
          helm template --values values.example.yaml .
