{{- if .Values.services.jellyfin.enabled }}
{{- $libraryPersistence := default dict .Values.services.jellyfin.libraryPersistence }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.services.jellyfin.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: "{{ .Values.services.jellyfin.image.repository }}:{{ .Values.services.jellyfin.image.tag }}"
          imagePullPolicy: {{ .Values.services.jellyfin.image.pullPolicy }}
          env:
            # - name: PUID
            #   value: "1000"
            # - name: PGID
            #   value: "1000"
            - name: TZ
              value: "{{ .Values.common.tz }}"
            - name: "JELLYFIN_PublishedServerUrl"
              value: "jellyfin.{{ .Values.services.traefik.domain }}"
          ports:
            - name: http
              containerPort: {{ .Values.services.jellyfin.ports.http }}
              protocol: TCP
            - name: udp
              containerPort: {{ .Values.services.jellyfin.ports.udp }}
              protocol: UDP
          securityContext:
            privileged: {{ .Values.services.jellyfin.privileged }}
          volumeMounts:
            - name: jellyfin-data
              mountPath: /config
              subPath: "{{ .Values.services.jellyfin.config }}"
            - name: jellyfin-data
              mountPath: /cache
              subPath: "{{ .Values.services.jellyfin.cache }}"
            - name: library
              mountPath: {{ default "/library" $libraryPersistence.mountPath }}
              readOnly: {{ default false $libraryPersistence.readOnly }}
            {{- with .Values.services.jellyfin.gpuDevices }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              mountPath: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- if and $libraryPersistence.enabled $libraryPersistence.readyFile }}
          startupProbe:
            exec:
              command: [sh, -ec, 'test -f "$1"', --, {{ printf "%s/%s" (trimSuffix "/" (default "/library" $libraryPersistence.mountPath)) $libraryPersistence.readyFile | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, 'test -f "$1"', --, {{ printf "%s/%s" (trimSuffix "/" (default "/library" $libraryPersistence.mountPath)) $libraryPersistence.readyFile | quote }}]
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
      volumes:
        - name: jellyfin-data
          persistentVolumeClaim:
            claimName: {{ include "ultimatehomeserver.persistence.claimName" .Values.services.jellyfin }}
        - name: library
          {{- if $libraryPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ required "services.jellyfin.libraryPersistence.claimName is required" $libraryPersistence.claimName }}
          {{- else }}
          hostPath:
            path: "{{ .Values.services.jellyfin.library }}"
            type: Directory
          {{- end }}
        {{- with .Values.services.jellyfin.gpuDevices }}
        {{- range $key, $value := . }}
        - name: {{ $key }}
          hostPath:
            path: {{ $value | quote }}
        {{- end }}
        {{- end }}
      {{- with .Values.services.jellyfin.nodeSelector }}
      nodeSelector:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.services.jellyfin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.jellyfin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with  .Values.services.jellyfin.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with  .Values.services.jellyfin.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
