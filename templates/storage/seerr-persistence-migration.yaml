{{- $volume := .Values.common.storage.persistentVolumes.seerr }}
{{- if and $volume $volume.migration $volume.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seerr-persistence-migration
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: seerr
    app.kubernetes.io/component: persistence-migration
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr-persistence-migration
    spec:
      restartPolicy: Never
      nodeSelector:
        {{- toYaml $volume.migration.nodeSelector | nindent 8 }}
      containers:
        - name: copy-state
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              test -d /source
              cp -a /source/. /destination/
              chown -R 1000:1000 /destination
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
      volumes:
        - name: source
          hostPath:
            path: {{ required "common.storage.persistentVolumes.seerr.migration.sourcePath is required" $volume.migration.sourcePath }}
            type: Directory
        - name: destination
          persistentVolumeClaim:
            claimName: {{ required "common.storage.persistentVolumes.seerr.claimName is required" $volume.claimName }}
{{- end }}
