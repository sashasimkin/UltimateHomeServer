{{- if .Values.common.storage.longhorn.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-volv-pvc
  namespace: {{ .Values.common.namespace }}
  {{- with .Values.common.storage.longhorn.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: {{ .Values.common.storage.longhorn.storageSize }}
{{- end }}
