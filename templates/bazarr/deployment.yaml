{{- if .Values.services.bazarr.enabled }}
{{- $libraryPersistence := default dict .Values.services.bazarr.libraryPersistence }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: bazarr
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.services.bazarr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr
    spec:
      containers:
        - name: bazarr
          image: "{{ .Values.services.bazarr.image.repository }}:{{ .Values.services.bazarr.image.tag }}"
          imagePullPolicy: {{ .Values.services.bazarr.image.pullPolicy }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "{{ .Values.common.tz }}"
          ports:
            - name: http
              containerPort: {{ .Values.services.bazarr.ports.http }}
              protocol: TCP
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
            - name: library
              mountPath: {{ default "/library" $libraryPersistence.mountPath }}
              {{- if $libraryPersistence.enabled }}
              readOnly: {{ default false $libraryPersistence.readOnly }}
              {{- end }}
          {{- if and $libraryPersistence.enabled $libraryPersistence.readyFile }}
          startupProbe:
            exec:
              command: [sh, -ec, 'test -f "$1"', --, {{ printf "%s/%s" (trimSuffix "/" (default "/library" $libraryPersistence.mountPath)) $libraryPersistence.readyFile | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, 'test -f "$1"', --, {{ printf "%s/%s" (trimSuffix "/" (default "/library" $libraryPersistence.mountPath)) $libraryPersistence.readyFile | quote }}]
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
      volumes:
        - name: bazarr-config
          {{- if and .Values.services.bazarr.persistence .Values.services.bazarr.persistence.use }}
          persistentVolumeClaim:
            claimName: {{ include "ultimatehomeserver.persistence.claimName" .Values.services.bazarr }}
          {{- else }}
          hostPath:
            path: "{{ .Values.services.bazarr.config }}"
            type: Directory
          {{- end }}
        - name: library
          {{- if $libraryPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ required "services.bazarr.libraryPersistence.claimName is required" $libraryPersistence.claimName }}
          {{- else }}
          hostPath:
            path: "{{ .Values.services.bazarr.library }}"
            type: Directory
          {{- end }}
      {{- with .Values.services.bazarr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.bazarr.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
