{{- if .Values.services.monobankFirefly3Bot.enabled }}
{{- $bot := .Values.services.monobankFirefly3Bot }}
{{- $_ := required "services.monobankFirefly3Bot.existingSecret must name an externally created Secret when the service is enabled" $bot.existingSecret }}
{{- $_ := required "services.monobankFirefly3Bot.webhookDomain is required when the service is enabled" $bot.webhookDomain }}
{{- $_ := required "services.monobankFirefly3Bot.fireflyApiUrl is required when the service is enabled" $bot.fireflyApiUrl }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monobank-firefly3-bot
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: monobank-firefly3-bot
spec:
  replicas: {{ $bot.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: monobank-firefly3-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monobank-firefly3-bot
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/monobank-firefly3-bot/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: monobank-firefly3-bot
          image: "{{ $bot.image.repository }}:{{ $bot.image.tag }}"
          imagePullPolicy: {{ $bot.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /etc/monobank-firefly3-bot/config.json
            - name: LISTEN
              value: {{ $bot.listen | quote }}
            - name: TIMEZONE_HOURS_DIFF
              value: {{ $bot.timezoneHoursDiff | quote }}
            - name: MONOBANK_WEBHOOK_DOMAIN
              value: {{ $bot.webhookDomain | quote }}
            - name: FIREFLY3_API_URL
              value: {{ $bot.fireflyApiUrl | quote }}
          envFrom:
            - secretRef:
                name: {{ $bot.existingSecret }}
          ports:
            - name: http
              containerPort: {{ $bot.ports.http }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/monobank-firefly3-bot
              readOnly: true
          {{- with $bot.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: monobank-firefly3-bot-config
      {{- with $bot.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $bot.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $bot.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
