{{- $bot := .Values.services.monobankFirefly3Bot }}
{{- $managed := $bot.managedWebhookSecret | default dict }}
{{- if and $bot.enabled $managed.enabled }}
{{- $name := include "ultimatehomeserver.monobank.webhookSecretName" $bot }}
{{- if eq $name $bot.existingSecret }}
{{- fail "managedWebhookSecret must use a separate Secret from existingSecret" }}
{{- end }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  namespace: {{ .Values.common.namespace }}
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.common.namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $name }}
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: Opaque
      data:
        MONOBANK_WEBHOOK_SECRET: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
{{- end }}
