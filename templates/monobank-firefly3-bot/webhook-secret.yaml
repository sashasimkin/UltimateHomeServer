{{- $bot := .Values.services.monobankFirefly3Bot }}
{{- $managed := $bot.managedWebhookSecret | default dict }}
{{- if and $bot.enabled $managed.enabled }}
{{- $name := include "ultimatehomeserver.monobank.webhookSecretName" $bot }}
{{- if eq $name $bot.existingSecret }}
{{- fail "managedWebhookSecret must use a separate Secret from existingSecret" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Values.common.namespace $name }}
{{- $value := "" }}
{{- if $existing }}
{{- $value = required "existing managed webhook Secret has no MONOBANK_WEBHOOK_SECRET; select a new version to replace it" (get ($existing.data | default dict) "MONOBANK_WEBHOOK_SECRET") }}
{{- else }}
{{- $value = randAlphaNum 64 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: monobank-firefly3-bot
    app.kubernetes.io/component: monobank-webhook-key
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
immutable: true
type: Opaque
data:
  MONOBANK_WEBHOOK_SECRET: {{ $value | quote }}
{{- end }}
