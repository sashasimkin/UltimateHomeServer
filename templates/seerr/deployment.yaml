{{- if .Values.services.seerr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: seerr
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.services.seerr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
    spec:
      initContainers:
        - name: init-config-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /app/config"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: seerr-config
              mountPath: /app/config
      containers:
        - name: seerr
          image: "{{ .Values.services.seerr.image.repository }}:{{ .Values.services.seerr.image.tag }}"
          imagePullPolicy: {{ .Values.services.seerr.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: TZ
              value: "{{ .Values.common.tz }}"
          ports:
            - name: http
              containerPort: {{ .Values.services.seerr.ports.http }}
              protocol: TCP
          volumeMounts:
            - name: seerr-config
              mountPath: /app/config
      volumes:
        - name: seerr-config
          hostPath:
            path: "{{ .Values.services.seerr.config }}"
            type: DirectoryOrCreate
{{- end }}
