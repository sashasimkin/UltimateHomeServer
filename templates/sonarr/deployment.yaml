{{- if .Values.services.sonarr.enabled }}
{{- $libraryPersistence := default dict .Values.services.sonarr.libraryPersistence }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: sonarr
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.services.sonarr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      containers:
        - name: sonarr
          image: "{{ .Values.services.sonarr.image.repository }}:{{ .Values.services.sonarr.image.tag }}"
          imagePullPolicy: {{ .Values.services.sonarr.image.pullPolicy }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "{{ .Values.common.tz }}"
          ports:
            - name: http
              containerPort: {{ .Values.services.sonarr.ports.http }}
              protocol: TCP
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: data
              mountPath: /data
            {{- if $libraryPersistence.enabled }}
            - name: library
              mountPath: {{ default "/library" $libraryPersistence.mountPath }}
              readOnly: {{ default false $libraryPersistence.readOnly }}
            {{- end }}

          {{- if and $libraryPersistence.enabled $libraryPersistence.readyFile }}
          startupProbe:
            exec:
              command: [sh, -ec, 'test -f "$1"', --, {{ printf "%s/%s" (trimSuffix "/" (default "/library" $libraryPersistence.mountPath)) $libraryPersistence.readyFile | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, 'test -f "$1"', --, {{ printf "%s/%s" (trimSuffix "/" (default "/library" $libraryPersistence.mountPath)) $libraryPersistence.readyFile | quote }}]
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}

      volumes:
        - name: sonarr-config
          {{- if and .Values.services.sonarr.persistence .Values.services.sonarr.persistence.use }}
          persistentVolumeClaim:
            claimName: {{ include "ultimatehomeserver.persistence.claimName" .Values.services.sonarr }}
          {{- else }}
          hostPath:
            path: "{{ .Values.services.sonarr.config }}"
            type: Directory
          {{- end }}
        - name: data
          hostPath:
            path: "{{ .Values.services.sonarr.data }}"
            type: Directory
        {{- if $libraryPersistence.enabled }}
        - name: library
          persistentVolumeClaim:
            claimName: {{ required "services.sonarr.libraryPersistence.claimName is required" $libraryPersistence.claimName }}
        {{- end }}
      {{- with .Values.services.sonarr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.sonarr.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
