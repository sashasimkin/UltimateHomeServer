{{- $tuya := .Values.services.tuyaIpc }}
{{- if $tuya.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuya-ipc-terminal
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: tuya-ipc-terminal
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tuya-ipc-terminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuya-ipc-terminal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: tuya-ipc-terminal
          image: "{{ required "services.tuyaIpc.image.repository is required" $tuya.image.repository }}:{{ required "services.tuyaIpc.image.tag is required" $tuya.image.tag }}"
          imagePullPolicy: {{ $tuya.image.pullPolicy }}
          args: ["rtsp", "start", "--port", "{{ $tuya.ports.rtsp }}"]
          workingDir: /data
          ports:
            - name: rtsp
              containerPort: {{ $tuya.ports.rtsp }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: rtsp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $tuya.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: session-data
              mountPath: /data
      volumes:
        - name: session-data
          persistentVolumeClaim:
            claimName: tuya-ipc-data
      {{- with $tuya.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tuya.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tuya.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
