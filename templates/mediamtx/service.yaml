{{- if .Values.services.mediamtx.enabled }}
{{- $mediamtx := .Values.services.mediamtx }}
{{- $webrtc := dig "webrtc" (dict) $mediamtx }}
{{- $webrtcEnabled := dig "enabled" false $webrtc }}
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: mediamtx
spec:
  type: ClusterIP
  ports:
    - name: rtsp
      port: {{ .Values.services.mediamtx.ports.rtsp }}
      targetPort: rtsp
      protocol: TCP
    {{- if $webrtcEnabled }}
    - name: webrtc-http
      port: {{ dig "httpPort" 8889 $webrtc }}
      targetPort: webrtc-http
      protocol: TCP
    - name: webrtc-ice
      port: {{ dig "iceUdpPort" 8189 $webrtc }}
      targetPort: webrtc-ice
      protocol: UDP
    {{- end }}
    {{- if .Values.services.mediamtx.moq.enabled }}
    - name: moq-http2
      port: {{ .Values.services.mediamtx.ports.moqHttp2 }}
      targetPort: moq-http2
      protocol: TCP
    - name: moq-http3
      port: {{ .Values.services.mediamtx.ports.moqHttp3 }}
      targetPort: moq-http3
      protocol: UDP
    - name: moq-quic
      port: {{ .Values.services.mediamtx.ports.moqQuic }}
      targetPort: moq-quic
      protocol: UDP
    {{- end }}
  selector:
    app.kubernetes.io/name: mediamtx
{{- end }}
