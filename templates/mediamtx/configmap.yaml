{{- if .Values.services.mediamtx.enabled }}
{{- $mediamtx := .Values.services.mediamtx }}
{{- $webrtc := dig "webrtc" (dict) $mediamtx }}
{{- $webrtcEnabled := dig "enabled" false $webrtc }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx
  namespace: {{ .Values.common.namespace }}
data:
  mediamtx.yml: |
    logLevel: info
    api: false
    metrics: false
    pprof: false
    rtsp: true
    rtspAddress: :{{ .Values.services.mediamtx.ports.rtsp }}
    rtspTransports: [tcp]
    rtmp: false
    hls: false
    webrtc: {{ $webrtcEnabled }}
    {{- if $webrtcEnabled }}
    webrtcAddress: :{{ dig "httpPort" 8889 $webrtc }}
    webrtcLocalUDPAddress: :{{ dig "iceUdpPort" 8189 $webrtc }}
    {{- with dig "additionalHosts" (list) $webrtc }}
    webrtcAdditionalHosts:
    {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with dig "allowedOrigins" (list) $webrtc }}
    webrtcAllowOrigins:
    {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
    srt: false
    moq: {{ .Values.services.mediamtx.moq.enabled }}
    {{- if .Values.services.mediamtx.moq.enabled }}
    moqHTTP2Address: :{{ .Values.services.mediamtx.ports.moqHttp2 }}
    moqHTTP3Address: :{{ .Values.services.mediamtx.ports.moqHttp3 }}
    moqQUICAddress: :{{ .Values.services.mediamtx.ports.moqQuic }}
    moqServerKey: auto.key
    moqServerCert: auto.crt
    {{- end }}
    paths:
    {{- if .Values.services.mediamtx.paths }}
    {{- toYaml .Values.services.mediamtx.paths | nindent 6 }}
    {{- else }}
      {}
    {{- end }}
{{- end }}
