{{- if .Values.services.mediamtx.enabled }}
{{- $mediamtx := .Values.services.mediamtx }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: mediamtx
spec:
  replicas: {{ $mediamtx.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mediamtx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediamtx
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: mediamtx
          image: "{{ $mediamtx.image.repository }}:{{ $mediamtx.image.tag }}"
          imagePullPolicy: {{ $mediamtx.image.pullPolicy }}
          args: ["/config/mediamtx.yml"]
          ports:
            - name: rtsp
              containerPort: {{ $mediamtx.ports.rtsp }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: rtsp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: rtsp
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          {{- with $mediamtx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: mediamtx
      {{- with $mediamtx.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mediamtx.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mediamtx.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
