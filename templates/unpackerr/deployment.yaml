{{- if .Values.services.unpackerr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: unpackerr
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.services.unpackerr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unpackerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpackerr
    spec:
      containers:
        - name: unpackerr
          image: "{{ .Values.services.unpackerr.image.repository }}:{{ .Values.services.unpackerr.image.tag }}"
          imagePullPolicy: {{ .Values.services.unpackerr.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.common.tz | quote }}
            - name: UN_SONARR_0_URL
              value: {{ .Values.services.unpackerr.sonarr.url | quote }}
            - name: UN_SONARR_0_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "services.unpackerr.sonarr.apiKeySecretName is required when Unpackerr is enabled" .Values.services.unpackerr.sonarr.apiKeySecretName | quote }}
                  key: {{ .Values.services.unpackerr.sonarr.apiKeySecretKey | quote }}
            - name: UN_SONARR_0_PATHS
              value: {{ .Values.services.unpackerr.downloads.mountPath | quote }}
          volumeMounts:
            - name: downloads
              mountPath: {{ .Values.services.unpackerr.downloads.mountPath | quote }}
          resources:
            {{- toYaml .Values.services.unpackerr.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: downloads
          hostPath:
            path: {{ required "services.unpackerr.downloads.hostPath is required when Unpackerr is enabled" .Values.services.unpackerr.downloads.hostPath | quote }}
            type: Directory
      {{- with .Values.services.unpackerr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.unpackerr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.unpackerr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.unpackerr.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
