{{- if .Values.services.radarr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: {{ .Values.common.namespace }}
  labels:
    app.kubernetes.io/name: radarr
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.services.radarr.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      containers:
        - name: radarr
          image: "{{ .Values.services.radarr.image.repository }}:{{ .Values.services.radarr.image.tag }}"
          imagePullPolicy: {{ .Values.services.radarr.image.pullPolicy }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "{{ .Values.common.tz }}"
          ports:
            - name: http
              containerPort: {{ .Values.services.radarr.ports.http }}
              protocol: TCP
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: data
              mountPath: /data

      volumes:
        - name: radarr-config
          {{- if and .Values.services.radarr.persistence .Values.services.radarr.persistence.use }}
          persistentVolumeClaim:
            claimName: {{ include "ultimatehomeserver.persistence.claimName" .Values.services.radarr }}
          {{- else }}
          hostPath:
            path: "{{ .Values.services.radarr.config }}"
            type: Directory
          {{- end }}
        - name: data
          hostPath:
            path: "{{ .Values.services.radarr.data }}"
            type: Directory
      {{- with .Values.services.radarr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.radarr.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
